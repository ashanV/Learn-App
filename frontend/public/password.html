<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <title>Reset Password</title>
</head>

<body>

    <div id="resetPasswordPage" class="auth-container">
        <div class="decorative-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="auth-page-container">
            <div class="auth-form-wrapper">
                <h2>Zresetuj hasło</h2>
                <form>
                    <p style="font-size: 0.875rem; color: var(--vervly-text); margin-bottom:1rem;">Podaj adres e-mail
                        powiązany z Twoim kontem, a wyślemy Ci link do zresetowania hasła.</p>
                    <input id="reset-email" type="email" required placeholder="Adres email">
                    <button type="button" class="form-button">Wyślij link do resetu</button>
                </form>
                <p class="form-link">Pamiętasz hasło? <a href="./login.html">Zaloguj się</a></p>
            </div>
        </div>
    </div>
</body>
<script type="module" src="/backend/auth/reset-password.js"></script>

</html>
